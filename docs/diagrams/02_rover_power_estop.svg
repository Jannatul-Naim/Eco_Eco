<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Power diagram. Two 3S LiPo packs. The motor pack BT1 goes through a 10 amp fuse and the 2-pin E-stop switch SW1 to the motor bus, which feeds both BTS7960 drivers and the servo buck; this side loses power when the E-stop is OFF. A divider on the motor bus tells S3 GPIO2, which is how the firmware sees the E-stop. The logic pack BT2 goes through a 3 amp fuse and the power switch SW2 to the fan and the logic buck, which powers the S3, camera, sonars and audio board; this side stays on.">
<style>svg{color:#16171B;background:#fff}text { fill: currentColor; font: 400 12.5px "Barlow", "Segoe UI", system-ui, sans-serif; }
text.t-h { font: 600 18px "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; }
text.t-s { fill: #5A5D65; font-size: 12px; }
text.t-p { font: 500 12px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
text.t-w { font-size: 12px; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
text.t-z { font: 600 15px "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .03em; }
text.c-5 { fill: #D11F1F; }
text.c-a { fill: #8F6B00; font-weight: 600; }
.box { fill: #FFFFFF; stroke: currentColor; stroke-width: 1.4; }
.box-new { fill: #FFF8DC; stroke: #8F6B00; stroke-width: 2.6; }
.box-stop { fill: none; stroke: #D11F1F; stroke-width: 2.2; }
.zone-cut { fill: #FFF3C7; }
.zone-on { fill: #E5F2E9; }
.wire { fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linejoin: round; stroke-linecap: round; }
.bus { stroke-width: 4; }
.w-5 { stroke: #D11F1F; } .w-b { stroke: #0B66C3; } .w-t { stroke: #087F5F; }
.w-o { stroke: #C25500; } .w-p { stroke: #7338BD; } .w-m { stroke: #B01F7C; }
.w-a { stroke: #8F6B00; stroke-dasharray: 5 4; }
.w-mot { stroke: #5A5D65; }
.thin { stroke-width: 1.6; }
.dash { stroke-dasharray: 4 4; }
.dot { fill: currentColor; } .dot-5 { fill: #D11F1F; } .dot-m { fill: #B01F7C; }
.pin { fill: #FFFFFF; stroke: currentColor; stroke-width: 1.5; }
.res { fill: #FFFFFF; stroke: #B01F7C; stroke-width: 2; }
.ah { fill: currentColor; } .ah-5 { fill: #D11F1F; }

</style>

      <rect class="zone-cut" x="560" y="28" width="430" height="240" rx="6"/>
      <rect class="zone-on" x="560" y="300" width="430" height="244" rx="6"/>
      <text class="t-z" x="574" y="48">Motor pack: dead when the E-stop is OFF</text>
      <text class="t-z" x="574" y="320">Logic pack: stays on, so the rover can report</text>

      <!-- motor pack -->
      <rect class="box" x="20" y="105" width="150" height="90" rx="5"/>
      <text class="t-h" x="32" y="130">BT1 motor pack</text>
      <text class="t-s" x="32" y="150">3S LiPo, 850 mAh</text>
      <text class="t-s" x="32" y="167">12.6 V full</text>
      <path class="wire" d="M95 195V212"/>
      <path class="wire thin" d="M83 212H107M88 218H102M92 224H98"/>
      <path class="wire w-5" d="M170 150H190"/>
      <rect class="box" x="190" y="136" width="64" height="28" rx="3"/>
      <text class="t-p" x="222" y="154" text-anchor="middle">F1 10A</text>
      <path class="wire w-5" d="M254 150H340"/>

      <rect class="box-stop" x="315" y="98" width="130" height="78" rx="9"/>
      <text class="t-w c-5" x="380" y="90" text-anchor="middle">SW1 E-STOP, 2-pin</text>
      <circle class="pin" cx="340" cy="150" r="3.5"/><circle class="pin" cx="420" cy="150" r="3.5"/>
      <path class="wire" d="M340 150L412 126"/>
      <text class="t-s" x="380" y="194" text-anchor="middle">carries all motor current</text>
      <path class="wire w-5" d="M420 150H600"/>
      <circle class="dot-5" cx="600" cy="150" r="4.5"/>

      <!-- motor bus -->
      <path class="wire w-5 bus" d="M600 75V230"/>
      <text class="t-w c-5" x="590" y="72" text-anchor="end">motor bus</text>

      <path class="wire w-5" d="M600 75H630"/><rect class="box" x="630" y="57" width="150" height="36" rx="4"/><text x="705" y="80" text-anchor="middle">BTS7960 left (J3)</text>
      <path class="wire w-mot" d="M780 75H800"/><rect class="box" x="800" y="57" width="178" height="36" rx="4"/><text x="889" y="80" text-anchor="middle">M1, M2 in parallel</text>

      <path class="wire w-5" d="M600 120H630"/><rect class="box" x="630" y="102" width="150" height="36" rx="4"/><text x="705" y="125" text-anchor="middle">BTS7960 right (J4)</text>
      <path class="wire w-mot" d="M780 120H800"/><rect class="box" x="800" y="102" width="178" height="36" rx="4"/><text x="889" y="125" text-anchor="middle">M3, M4 in parallel</text>

      <path class="wire w-5" d="M600 180H630"/><rect class="box" x="630" y="162" width="150" height="36" rx="4"/><text x="705" y="185" text-anchor="middle">XL4015 servo 5 V (J5)</text>
      <path class="wire w-5" d="M780 180H800"/><rect class="box" x="800" y="162" width="178" height="36" rx="4"/><text x="889" y="185" text-anchor="middle">SG90 camera pan</text>

      <path class="wire w-m" d="M600 230H630"/>
      <rect class="box" x="630" y="212" width="348" height="40" rx="4"/>
      <text x="642" y="229">R23/R24 divider to S3 GPIO2: the E-stop sense</text>
      <text class="t-s" x="642" y="245">R25 1 kΩ bleed empties the bus in about 1 s</text>

      <text class="t-s" x="20" y="285">BT1 − and BT2 − join at one star point near the drivers' B−.</text>

      <!-- logic pack -->
      <rect class="box" x="20" y="375" width="150" height="90" rx="5"/>
      <text class="t-h" x="32" y="400">BT2 logic pack</text>
      <text class="t-s" x="32" y="420">3S LiPo, 850 mAh</text>
      <text class="t-s" x="32" y="437">12.6 V full</text>
      <path class="wire" d="M95 465V482"/>
      <path class="wire thin" d="M83 482H107M88 488H102M92 494H98"/>
      <path class="wire w-5" d="M170 420H190"/>
      <rect class="box" x="190" y="406" width="64" height="28" rx="3"/>
      <text class="t-p" x="222" y="424" text-anchor="middle">F2 3A</text>
      <path class="wire w-5" d="M254 420H340"/>
      <rect class="box" x="315" y="372" width="130" height="74" rx="9"/>
      <text class="t-w" x="380" y="364" text-anchor="middle">SW2 POWER, 2-pin</text>
      <circle class="pin" cx="340" cy="420" r="3.5"/><circle class="pin" cx="420" cy="420" r="3.5"/>
      <path class="wire" d="M340 420L412 396"/>
      <path class="wire w-5" d="M420 420H460"/>
      <circle class="dot-5" cx="440" cy="420" r="4"/>
      <path class="wire w-5" d="M440 420V490"/>
      <rect class="box" x="385" y="490" width="110" height="36" rx="4"/>
      <text x="440" y="513" text-anchor="middle">FAN1 12 V</text>
      <rect class="box" x="460" y="396" width="96" height="48" rx="4"/>
      <text x="508" y="416" text-anchor="middle">XL4015</text>
      <text class="t-s" x="508" y="433" text-anchor="middle">logic 5.0 V</text>
      <path class="wire w-5" d="M556 420H600"/>
      <path class="wire w-5 bus" d="M600 360V512"/>
      <circle class="dot-5" cx="600" cy="420" r="4.5"/>

      <path class="wire w-5" d="M600 360H630"/>
      <rect class="box" x="630" y="338" width="348" height="44" rx="4"/>
      <text x="642" y="356" font-weight="600">ESP32-S3</text>
      <text class="t-s" x="642" y="373">latches ESTOP when the motor bus drops; reports why</text>
      <path class="wire w-5" d="M600 412H630"/>
      <rect class="box" x="630" y="394" width="348" height="36" rx="4"/>
      <text x="642" y="417" font-weight="600">ESP32-CAM</text>
      <path class="wire w-5" d="M600 462H630"/>
      <rect class="box" x="630" y="444" width="348" height="36" rx="4"/>
      <text x="642" y="467" font-weight="600">HC-SR04 sonars ×4</text>
      <path class="wire w-5" d="M600 512H630"/>
      <rect class="box" x="630" y="494" width="348" height="36" rx="4"/>
      <text x="642" y="517" font-weight="600">ESP32 DevKit audio, MAX98357A (optional)</text>
    </svg>
