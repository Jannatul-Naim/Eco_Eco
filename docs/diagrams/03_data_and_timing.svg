<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-label="Data flow. Laptop sends drive commands to the S3 and receives telemetry. S3 drives the motor drivers and reads the sonars. S3 and camera exchange messages over three wires. The camera sends video straight to the laptop over Wi-Fi and drives the servo itself. The E-stop cuts motor power directly, without software.">
<style>svg{color:#16171B;background:#fff}text { fill: currentColor; font: 400 12.5px "Barlow", "Segoe UI", system-ui, sans-serif; }
text.t-h { font: 600 18px "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; }
text.t-s { fill: #5A5D65; font-size: 12px; }
text.t-p { font: 500 12px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
text.t-w { font-size: 12px; paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
text.t-z { font: 600 15px "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .03em; }
text.c-5 { fill: #D11F1F; }
text.c-a { fill: #8F6B00; font-weight: 600; }
.box { fill: #FFFFFF; stroke: currentColor; stroke-width: 1.4; }
.box-new { fill: #FFF8DC; stroke: #8F6B00; stroke-width: 2.6; }
.box-stop { fill: none; stroke: #D11F1F; stroke-width: 2.2; }
.zone-cut { fill: #FFF3C7; }
.zone-on { fill: #E5F2E9; }
.wire { fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linejoin: round; stroke-linecap: round; }
.bus { stroke-width: 4; }
.w-5 { stroke: #D11F1F; } .w-b { stroke: #0B66C3; } .w-t { stroke: #087F5F; }
.w-o { stroke: #C25500; } .w-p { stroke: #7338BD; } .w-m { stroke: #B01F7C; }
.w-a { stroke: #8F6B00; stroke-dasharray: 5 4; }
.w-mot { stroke: #5A5D65; }
.thin { stroke-width: 1.6; }
.dash { stroke-dasharray: 4 4; }
.dot { fill: currentColor; } .dot-5 { fill: #D11F1F; } .dot-m { fill: #B01F7C; }
.pin { fill: #FFFFFF; stroke: currentColor; stroke-width: 1.5; }
.res { fill: #FFFFFF; stroke: #B01F7C; stroke-width: 2; }
.ah { fill: currentColor; } .ah-5 { fill: #D11F1F; }

</style>
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
        <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah-5" d="M0 0L10 5L0 10z"/></marker>
      </defs>

      <rect class="box" x="30" y="110" width="190" height="140" rx="5"/>
      <text class="t-h" x="44" y="138">Laptop</text>
      <text class="t-s" x="44" y="157">dashboard and gamepad</text>
      <text class="t-s" x="44" y="174">locked out while in AUTO</text>

      <rect class="box" x="430" y="110" width="180" height="140" rx="5"/>
      <text class="t-h" x="444" y="138">ESP32-S3</text>
      <text class="t-s" x="444" y="157">only motor authority</text>
      <text class="t-s" x="444" y="174">mission logic, ping</text>
      <text class="t-s" x="444" y="191">control loop every 10 ms</text>

      <rect class="box" x="800" y="110" width="170" height="60" rx="5"/>
      <text class="t-h" x="885" y="146" text-anchor="middle">Drivers, motors</text>
      <rect class="box" x="800" y="190" width="170" height="60" rx="5"/>
      <text class="t-h" x="885" y="226" text-anchor="middle">Sonars</text>

      <rect class="box-stop" x="800" y="10" width="170" height="52" rx="9"/>
      <text class="t-h c-5" x="885" y="42" text-anchor="middle">E-stop button</text>
      <path class="wire w-5" d="M885 62V108" marker-end="url(#ahr)"/>
      <text class="t-w" x="877" y="89" text-anchor="end">cuts power, no software</text>

      <rect class="box" x="430" y="340" width="180" height="90" rx="5"/>
      <text class="t-h" x="444" y="368">ESP32-CAM</text>
      <text class="t-s" x="444" y="387">video, QR, motion</text>
      <text class="t-s" x="444" y="404">runs the servo</text>

      <rect class="box" x="800" y="355" width="170" height="60" rx="5"/>
      <text class="t-h" x="885" y="391" text-anchor="middle">MG996R</text>

      <rect class="box" x="30" y="430" width="190" height="60" rx="5"/>
      <text class="t-h" x="44" y="456">ESP32 DevKit</text>
      <text class="t-s" x="44" y="474">audio (optional, teleop only)</text>

      <!-- laptop and S3 -->
      <path class="wire" d="M220 150H428" marker-end="url(#ah)"/>
      <text class="t-w" x="325" y="126" text-anchor="middle">drive commands</text>
      <text class="t-w" x="325" y="142" text-anchor="middle">300 ms of silence stops the wheels</text>
      <path class="wire" d="M430 205H222" marker-end="url(#ah)"/>
      <text class="t-w" x="325" y="197" text-anchor="middle">telemetry every 75 ms</text>
      <text class="t-w" x="325" y="222" text-anchor="middle">measured 79 ms; rulebook limit 100 ms</text>

      <!-- S3 and outputs -->
      <path class="wire" d="M610 140H798" marker-end="url(#ah)"/>
      <text class="t-w" x="704" y="132" text-anchor="middle">PWM 20 kHz</text>
      <path class="wire" d="M800 220H612" marker-end="url(#ah)"/>
      <text class="t-w" x="704" y="212" text-anchor="middle">one sonar per 40 ms slot</text>
      <text class="t-w" x="704" y="238" text-anchor="middle">older than 400 ms is not trusted</text>

      <!-- S3 and camera -->
      <path class="wire" d="M480 340V252" marker-end="url(#ah)"/>
      <text class="t-w" x="472" y="285" text-anchor="end">heartbeat every 200 ms</text>
      <text class="t-w" x="472" y="301" text-anchor="end">QR and motion results</text>
      <text class="t-w" x="472" y="317" text-anchor="end">silent for 1 s: mission safe-stops</text>
      <path class="wire" d="M560 250V338" marker-end="url(#ah)"/>
      <text class="t-w" x="568" y="285">what to run, pan mode</text>
      <text class="t-w" x="568" y="301">every 200 ms</text>
      <text class="t-w" x="568" y="317">silent for 1.5 s: detectors off, pan holds</text>

      <!-- camera outputs -->
      <path class="wire" d="M610 385H798" marker-end="url(#ah)"/>
      <text class="t-w" x="704" y="377" text-anchor="middle">servo pulses, 50 Hz</text>
      <text class="t-w" x="704" y="401" text-anchor="middle">tracks without asking the S3</text>
      <path class="wire" d="M430 385H125V252" marker-end="url(#ah)"/>
      <text class="t-w" x="290" y="377" text-anchor="middle">video straight over Wi-Fi, up to 12 fps</text>
      <text class="t-w" x="290" y="401" text-anchor="middle">never passes through the S3</text>

      <!-- audio -->
      <path class="wire" d="M60 430V252" marker-end="url(#ah)"/>
      <text class="t-w" x="68" y="330">audio</text>
      <text class="t-w" x="68" y="346">Wi-Fi</text>
    </svg>
