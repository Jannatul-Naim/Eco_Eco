; URRT autonomous rover — PlatformIO project
;
; One project, separate environments per board:
;   s3_main            ESP32-S3 main controller, logs on the USB-UART bridge port ("COM"/"UART")
;   s3_main_nativeusb  same firmware, logs on the S3 native USB port ("USB")
;   cam                ESP32-CAM vision board (stream, QR decode, motion detection only)
;   audio              OPTIONAL ESP32 DevKit audio bridge (no motor authority)
;   native             host-side unit tests for shared protocol / IPv4 code
;
; Use a current PlatformIO Core (6.x). The Ubuntu apt package "platformio 4.3.4"
; cannot parse this platform; see docs/06_bringup_guide.md section 0.
;
; Serial ports in the docs (/dev/ttyACM0, /dev/ttyUSB0, COM5) are EXAMPLES.
; Use the port that `pio device list` reports for your board.

[platformio]
default_envs = s3_main, cam, audio
data_dir = data

[common]
; Arduino-ESP32 2.0.17 (final 2.x release). platform 8.0.0 (Arduino 3.3)
; was only days old when this project was generated; see docs/08_status.md.
platform = platformio/espressif32 @ 6.13.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_src_flags = -Wall -Wextra
lib_deps_web =
    esp32async/ESPAsyncWebServer @ 3.12.1
    esp32async/AsyncTCP @ 3.5.0
lib_deps_json =
    bblanchon/ArduinoJson @ 7.4.3

; ---------------------------------------------------------------- ESP32-S3
[env:s3_main]
platform = ${common.platform}
framework = ${common.framework}
; Generic S3 DevKitC-1 compatible definition. The physical board identity is
; NOT confirmed (marking "ESP32 23 2022 V1.3"); flash is limited to 4 MB so the
; image also runs on 8/16 MB modules. PSRAM is not used.
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.filesystem = littlefs
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_src_filter = +<s3/>
build_src_flags = ${common.build_src_flags}
build_flags =
    -DROVER_BOARD_S3=1
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    ${common.lib_deps_web}
    ${common.lib_deps_json}
lib_ignore = quirc

[env:s3_main_nativeusb]
extends = env:s3_main
build_flags =
    -DROVER_BOARD_S3=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------- ESP32-CAM
[env:cam]
platform = ${common.platform}
framework = ${common.framework}
; AI-Thinker ESP32-CAM layout (PROVISIONAL until the board is identified).
board = esp32cam
board_build.partitions = huge_app.csv
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_src_filter = +<cam/>
build_src_flags = ${common.build_src_flags}
build_flags =
    -DROVER_BOARD_CAM=1
    -DQUIRC_FLOAT_TYPE=float
    -DQUIRC_USE_TGMATH=1
lib_deps =
    ${common.lib_deps_json}

; ---------------------------------------------------------------- AUDIO (optional)
[env:audio]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
build_src_filter = +<audio/>
build_src_flags = ${common.build_src_flags}
build_flags =
    -DROVER_BOARD_AUDIO=1
lib_deps =
    ${common.lib_deps_web}
    ${common.lib_deps_json}
lib_ignore = quirc

; ---------------------------------------------------------------- host tests
[env:native]
platform = native
build_src_filter = -<*>
test_build_src = no
lib_ignore = quirc
